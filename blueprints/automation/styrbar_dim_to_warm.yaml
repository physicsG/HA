# Styrbar (Z2M) — simplified controller
#
# Z2M-only port of the upstream IKEA E2001/E2002 STYRBAR controller
# blueprint, trimmed to just one integration and one device. Exposes
# bare action slots for short / long / release / double on all four
# buttons, optional long-press looping, and optional virtual
# double-press detection (per-button opt in).
#
# Pair it with a separate script/automation if you want dim-to-warm
# behaviour — keep this blueprint dumb so the controller half is easy
# to debug.
#
# Adapted from:
#   https://github.com/EPMatt/awesome-ha-blueprints
#   blueprints/controllers/ikea_e2001_e2002/ikea_e2001_e2002.yaml
#   (MIT, EPMatt). Trimmed to Zigbee2MQTT only.

blueprint:
  name: "Styrbar (Z2M) — Controller"
  description: >
    Simplified Zigbee2MQTT controller automation for the IKEA STYRBAR
    (E2001/E2002). Exposes action slots for short, long, release and
    optional virtual double-press on each of the four arrow buttons,
    plus optional looping while the long-press is held.

    Requires a single input_text helper used to detect double-press
    and to know which button is being held during a release event.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    controller_device:
      name: "STYRBAR remote (Z2M)"
      description: "The Zigbee2MQTT STYRBAR device."
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control (E2001/E2002)
          multiple: false
    helper_last_controller_event:
      name: "Helper — Last controller event"
      description: >
        input_text used to remember the last button event so double-press
        and release-after-hold can be detected. Create this manually
        under Settings → Devices & services → Helpers.
      selector:
        entity:
          domain: input_text

    # ── Action slots ─────────────────────────────────────────
    action_button_left_short:
      name: "Left — short press"
      default: []
      selector: { action: {} }
    action_button_left_long:
      name: "Left — long press (hold)"
      default: []
      selector: { action: {} }
    action_button_left_release:
      name: "Left — release after hold"
      default: []
      selector: { action: {} }
    action_button_left_double:
      name: "Left — double press (virtual)"
      default: []
      selector: { action: {} }

    action_button_right_short:
      name: "Right — short press"
      default: []
      selector: { action: {} }
    action_button_right_long:
      name: "Right — long press (hold)"
      default: []
      selector: { action: {} }
    action_button_right_release:
      name: "Right — release after hold"
      default: []
      selector: { action: {} }
    action_button_right_double:
      name: "Right — double press (virtual)"
      default: []
      selector: { action: {} }

    action_button_up_short:
      name: "Up — short press"
      default: []
      selector: { action: {} }
    action_button_up_long:
      name: "Up — long press (hold)"
      default: []
      selector: { action: {} }
    action_button_up_release:
      name: "Up — release after hold"
      default: []
      selector: { action: {} }
    action_button_up_double:
      name: "Up — double press (virtual)"
      default: []
      selector: { action: {} }

    action_button_down_short:
      name: "Down — short press"
      default: []
      selector: { action: {} }
    action_button_down_long:
      name: "Down — long press (hold)"
      default: []
      selector: { action: {} }
    action_button_down_release:
      name: "Down — release after hold"
      default: []
      selector: { action: {} }
    action_button_down_double:
      name: "Down — double press (virtual)"
      default: []
      selector: { action: {} }

    # ── Long-press looping ──────────────────────────────────
    button_left_long_loop:
      name: "Left — loop long press"
      default: false
      selector: { boolean: {} }
    button_right_long_loop:
      name: "Right — loop long press"
      default: false
      selector: { boolean: {} }
    button_up_long_loop:
      name: "Up — loop long press"
      default: false
      selector: { boolean: {} }
    button_down_long_loop:
      name: "Down — loop long press"
      default: false
      selector: { boolean: {} }
    long_press_max_loop_repeats:
      name: "Long-press max loop repeats (safety cap)"
      default: 500
      selector:
        number:
          min: 1
          max: 5000
          step: 1
          mode: slider

    # ── Double-press toggles ────────────────────────────────
    button_left_double_press:
      name: "Expose left double-press"
      default: false
      selector: { boolean: {} }
    button_right_double_press:
      name: "Expose right double-press"
      default: false
      selector: { boolean: {} }
    button_up_double_press:
      name: "Expose up double-press"
      default: false
      selector: { boolean: {} }
    button_down_double_press:
      name: "Expose down double-press"
      default: false
      selector: { boolean: {} }

    helper_double_press_delay:
      name: "Helper — Double-press window (ms)"
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          step: 10
          unit_of_measurement: ms
          mode: box
    helper_debounce_delay:
      name: "Helper — Debounce delay (ms)"
      description: >
        Set to 0 to disable. If you see actions firing twice per press,
        try 100.
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 10
          unit_of_measurement: ms
          mode: box

# ═══════════════════════════════════════════════════════════════
#  Variables
# ═══════════════════════════════════════════════════════════════
variables:
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  helper_debounce_delay: !input helper_debounce_delay
  long_press_max_loop_repeats: !input long_press_max_loop_repeats
  adjusted_double_press_delay: "{{ [(helper_double_press_delay | int) - (helper_debounce_delay | int), 100] | max }}"
  button_left_long_loop: !input button_left_long_loop
  button_right_long_loop: !input button_right_long_loop
  button_up_long_loop: !input button_up_long_loop
  button_down_long_loop: !input button_down_long_loop
  button_left_double_press: !input button_left_double_press
  button_right_double_press: !input button_right_double_press
  button_up_double_press: !input button_up_double_press
  button_down_double_press: !input button_down_double_press
  controller_id: !input controller_device

# ═══════════════════════════════════════════════════════════════
#  Mode — restart so a new press cancels the in-flight wait
#  used for double-press detection (matches upstream behaviour).
# ═══════════════════════════════════════════════════════════════
mode: restart
max_exceeded: silent

# ═══════════════════════════════════════════════════════════════
#  Triggers — Z2M MQTT device actions only
# ═══════════════════════════════════════════════════════════════
triggers:
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_left_click
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_left_hold
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_left_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_right_click
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_right_hold
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_right_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: "on"
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: brightness_move_up
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: brightness_stop
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: "off"
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: brightness_move_down

# ═══════════════════════════════════════════════════════════════
#  Actions
# ═══════════════════════════════════════════════════════════════
actions:
  # Optional debounce — shorter parallel runs are killed by mode:restart
  # before this delay expires; only the latest one continues.
  - delay:
      milliseconds: "{{ helper_debounce_delay | int }}"

  - variables:
      # Z2M MQTT device triggers expose the action string via trigger.payload.
      trigger_action_final: "{{ trigger.payload | default('') | string }}"
      raw_helper: "{{ states(helper_last_controller_event) | string }}"
      parsed_helper: >-
        {{ (raw_helper | from_json) if (raw_helper.startswith('{') and raw_helper.endswith('}')) else {} }}
      last_controller_event: "{{ parsed_helper.a | default('') }}"
      last_controller_event_t: "{{ parsed_helper.t | default(0) | float(0) }}"
      trigger_delta: "{{ ((as_timestamp(now()) - last_controller_event_t) * 1000) | int }}"

  # Always update the helper with the raw event so release/double-press
  # logic in subsequent runs has something to read.
  - action: input_text.set_value
    target:
      entity_id: !input helper_last_controller_event
    data:
      value: >-
        {{ {'a': trigger_action_final, 't': as_timestamp(now())} | to_json }}

  - choose:
      # ════ LEFT short ════
      - conditions: "{{ trigger_action_final == 'arrow_left_click' }}"
        sequence:
          - choose:
              - conditions: "{{ button_left_double_press }}"
                sequence:
                  - choose:
                      - conditions:
                          - "{{ last_controller_event == 'arrow_left_click' }}"
                          - "{{ trigger_delta <= (helper_double_press_delay | int) }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input helper_last_controller_event
                            data:
                              value: '{{ {"a":"double_press_left","t":as_timestamp(now())} | to_json }}'
                          - choose:
                              - conditions: []
                                sequence: !input action_button_left_double
                    default:
                      - delay:
                          milliseconds: "{{ adjusted_double_press_delay | int }}"
                      - choose:
                          - conditions: []
                            sequence: !input action_button_left_short
            default:
              - choose:
                  - conditions: []
                    sequence: !input action_button_left_short

      # ════ LEFT long ════
      - conditions: "{{ trigger_action_final == 'arrow_left_hold' }}"
        sequence:
          - choose:
              - conditions: "{{ button_left_long_loop }}"
                sequence:
                  - repeat:
                      while: "{{ repeat.index < (long_press_max_loop_repeats | int) }}"
                      sequence: !input action_button_left_long
            default: !input action_button_left_long

      # ════ LEFT release ════
      - conditions:
          - "{{ trigger_action_final == 'arrow_left_release' }}"
          - "{{ last_controller_event in ['arrow_left_hold', 'arrow_left_release'] }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_left_release

      # ════ RIGHT short ════
      - conditions: "{{ trigger_action_final == 'arrow_right_click' }}"
        sequence:
          - choose:
              - conditions: "{{ button_right_double_press }}"
                sequence:
                  - choose:
                      - conditions:
                          - "{{ last_controller_event == 'arrow_right_click' }}"
                          - "{{ trigger_delta <= (helper_double_press_delay | int) }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input helper_last_controller_event
                            data:
                              value: '{{ {"a":"double_press_right","t":as_timestamp(now())} | to_json }}'
                          - choose:
                              - conditions: []
                                sequence: !input action_button_right_double
                    default:
                      - delay:
                          milliseconds: "{{ adjusted_double_press_delay | int }}"
                      - choose:
                          - conditions: []
                            sequence: !input action_button_right_short
            default:
              - choose:
                  - conditions: []
                    sequence: !input action_button_right_short

      # ════ RIGHT long ════
      - conditions: "{{ trigger_action_final == 'arrow_right_hold' }}"
        sequence:
          - choose:
              - conditions: "{{ button_right_long_loop }}"
                sequence:
                  - repeat:
                      while: "{{ repeat.index < (long_press_max_loop_repeats | int) }}"
                      sequence: !input action_button_right_long
            default: !input action_button_right_long

      # ════ RIGHT release ════
      - conditions:
          - "{{ trigger_action_final == 'arrow_right_release' }}"
          - "{{ last_controller_event in ['arrow_right_hold', 'arrow_right_release'] }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_right_release

      # ════ UP short ════
      - conditions: "{{ trigger_action_final == 'on' }}"
        sequence:
          - choose:
              - conditions: "{{ button_up_double_press }}"
                sequence:
                  - choose:
                      - conditions:
                          - "{{ last_controller_event == 'on' }}"
                          - "{{ trigger_delta <= (helper_double_press_delay | int) }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input helper_last_controller_event
                            data:
                              value: '{{ {"a":"double_press_up","t":as_timestamp(now())} | to_json }}'
                          - choose:
                              - conditions: []
                                sequence: !input action_button_up_double
                    default:
                      - delay:
                          milliseconds: "{{ adjusted_double_press_delay | int }}"
                      - choose:
                          - conditions: []
                            sequence: !input action_button_up_short
            default:
              - choose:
                  - conditions: []
                    sequence: !input action_button_up_short

      # ════ UP long ════
      - conditions: "{{ trigger_action_final == 'brightness_move_up' }}"
        sequence:
          - choose:
              - conditions: "{{ button_up_long_loop }}"
                sequence:
                  - repeat:
                      while: "{{ repeat.index < (long_press_max_loop_repeats | int) }}"
                      sequence: !input action_button_up_long
            default: !input action_button_up_long

      # ════ DOWN short ════
      - conditions: "{{ trigger_action_final == 'off' }}"
        sequence:
          - choose:
              - conditions: "{{ button_down_double_press }}"
                sequence:
                  - choose:
                      - conditions:
                          - "{{ last_controller_event == 'off' }}"
                          - "{{ trigger_delta <= (helper_double_press_delay | int) }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input helper_last_controller_event
                            data:
                              value: '{{ {"a":"double_press_down","t":as_timestamp(now())} | to_json }}'
                          - choose:
                              - conditions: []
                                sequence: !input action_button_down_double
                    default:
                      - delay:
                          milliseconds: "{{ adjusted_double_press_delay | int }}"
                      - choose:
                          - conditions: []
                            sequence: !input action_button_down_short
            default:
              - choose:
                  - conditions: []
                    sequence: !input action_button_down_short

      # ════ DOWN long ════
      - conditions: "{{ trigger_action_final == 'brightness_move_down' }}"
        sequence:
          - choose:
              - conditions: "{{ button_down_long_loop }}"
                sequence:
                  - repeat:
                      while: "{{ repeat.index < (long_press_max_loop_repeats | int) }}"
                      sequence: !input action_button_down_long
            default: !input action_button_down_long

      # ════ UP/DOWN release (shared brightness_stop event) ════
      - conditions:
          - "{{ trigger_action_final == 'brightness_stop' }}"
          - "{{ last_controller_event in ['brightness_move_up', 'brightness_stop'] }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_up_release

      - conditions:
          - "{{ trigger_action_final == 'brightness_stop' }}"
          - "{{ last_controller_event == 'brightness_move_down' }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_down_release
