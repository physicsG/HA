# Styrbar (Z2M) — Multi-state controller
#
# Z2M-only IKEA STYRBAR controller with four switchable behaviour states
# for the Up/Down buttons:
#   1. Dim-to-warm  — Up/Down change brightness + matching color temp.
#   2. Color cycle  — Up/Down step through a configurable RGB color list.
#   3. Brightness   — Up/Down change brightness only (color untouched).
#   4. Scene cycle  — Up/Down step through a configurable scene list.
#
# Right short  = next state (1 → 2 → 3 → 4 → 1).
# Left short   = jump to default state.
# A short flicker on the target lights signals the new state.
#
# Adapted from:
#   https://github.com/EPMatt/awesome-ha-blueprints
#   blueprints/controllers/ikea_e2001_e2002/ikea_e2001_e2002.yaml
#   (MIT, EPMatt). Trimmed to Zigbee2MQTT only.

blueprint:
  name: "Styrbar (Z2M) — Multi-state controller"
  description: >
    Zigbee2MQTT IKEA STYRBAR (E2001/E2002) controller with four switchable
    Up/Down behaviour states (dim-to-warm, color cycle, brightness only, scene
    cycle). Right short cycles forward through the states, Left short jumps to
    the configured default state. Each state change is signalled by a brief
    flicker on the target lights.

    Requires two input_text helpers: one for last controller event (double-press
    + release detection), and one storing the combined dim/kelvin/state JSON.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    # ══════════════════════════════════════════════════════════
    #  Helpers
    # ══════════════════════════════════════════════════════════
    helper_last_controller_event:
      name: "Helper — Last controller event"
      description: >
        input_text used to remember the last button event so double-press and
        release-after-hold can be detected. Create this manually under Settings
        → Devices & services → Helpers.
      selector:
        entity:
          domain: input_text
    helper_state:
      name: "Helper — Combined state"
      description: >
        input_text storing all blueprint state as a single JSON object, e.g.
        {"b":180,"k":2700,"s":2,"i":3}. `b` = brightness 1–255 (state 1/3), `k`
        = kelvin (state 1), `s` = current Up/Down state 1–4, `i` = cycle index
        (state 2/4). Writes use a merge pattern, so additional keys can be added
        by future states without conflict. Create this manually under Settings →
        Devices & services → Helpers.
      selector:
        entity:
          domain: input_text

    # ══════════════════════════════════════════════════════════
    #  Hardware
    # ══════════════════════════════════════════════════════════
    controller_device:
      name: "STYRBAR remote (Z2M)"
      description: "The Zigbee2MQTT STYRBAR device."
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control (E2001/E2002)
          multiple: false
    target_lights:
      name: "Target light(s)"
      description: >
        Light(s) controlled by the Up/Down buttons. Color and brightness are
        sent in two sequential light.turn_on calls (color first, then
        brightness) for a smoother visual ramp on IKEA bulbs.
      selector:
        entity:
          domain: light
          multiple: true

    # ══════════════════════════════════════════════════════════
    #  Dim-to-warm tuning
    # ══════════════════════════════════════════════════════════
    dim_to_warm_enabled:
      name: "Change color with brightness"
      description: >
        When enabled (default), the color temperature is recomputed and sent
        alongside every brightness change. When disabled, only brightness is
        sent — the lights keep whatever color they currently have.
      default: true
      selector: { boolean: {} }
    min_kelvin:
      name: "Min Kelvin (at lowest brightness)"
      default: 2200
      selector:
        color_temp:
          unit: kelvin
          min: 1800
          max: 6500
    max_kelvin:
      name: "Max Kelvin (at full brightness)"
      default: 4000
      selector:
        color_temp:
          unit: kelvin
          min: 1800
          max: 6500
    default_brightness:
      name: "Default brightness when helper is empty"
      default: 200
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: slider
    bright_step:
      name: "Brightness step (0–255 units)"
      default: 25
      selector:
        number:
          min: 5
          max: 64
          step: 1
          mode: slider
    transition:
      name: "Transition (s)"
      default: 0.3
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: s
          mode: slider

    # ══════════════════════════════════════════════════════════
    #  State configuration
    # ══════════════════════════════════════════════════════════
    default_state:
      name: "Default state (Left short jumps here)"
      description: >
        1 = dim-to-warm, 2 = color cycle, 3 = brightness only, 4 = scene cycle.
      default: 1
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: slider
    state_2_color_1:
      name: "State 2 — color 1 (RGB)"
      default: [ 255, 0, 0 ]
      selector: { color_rgb: {} }
    state_2_color_2:
      name: "State 2 — color 2 (RGB)"
      default: [ 0, 255, 0 ]
      selector: { color_rgb: {} }
    state_2_color_3:
      name: "State 2 — color 3 (RGB)"
      default: [ 0, 0, 255 ]
      selector: { color_rgb: {} }
    state_2_color_4:
      name: "State 2 — color 4 (RGB)"
      default: [ 255, 180, 80 ]
      selector: { color_rgb: {} }
    state_2_color_5:
      name: "State 2 — color 5 (RGB)"
      default: [ 200, 220, 255 ]
      selector: { color_rgb: {} }
    state_4_scenes:
      name: "State 4 — scene list"
      description: >
        Scenes that Up/Down will cycle through when state 4 is active.
      default: []
      selector:
        entity:
          domain: scene
          multiple: true
    state_indicator_enabled:
      name: "Show state-change indicator on lights"
      default: true
      selector: { boolean: {} }
    state_indicator_duration_ms:
      name: "State-change indicator duration (ms)"
      default: 400
      selector:
        number:
          min: 100
          max: 2000
          step: 50
          unit_of_measurement: ms
          mode: slider

    # ══════════════════════════════════════════════════════════
    #  Action slots
    # ══════════════════════════════════════════════════════════
    action_button_left_short:
      name: "Left — short press"
      default: []
      selector: { action: {} }
    action_button_left_long:
      name: "Left — long press (hold)"
      default: []
      selector: { action: {} }
    action_button_left_release:
      name: "Left — release after hold"
      default: []
      selector: { action: {} }
    action_button_left_double:
      name: "Left — double press (virtual)"
      default: []
      selector: { action: {} }

    action_button_right_short:
      name: "Right — short press"
      default: []
      selector: { action: {} }
    action_button_right_long:
      name: "Right — long press (hold)"
      default: []
      selector: { action: {} }
    action_button_right_release:
      name: "Right — release after hold"
      default: []
      selector: { action: {} }
    action_button_right_double:
      name: "Right — double press (virtual)"
      default: []
      selector: { action: {} }

    action_button_up_short:
      name: "Up — short press"
      default: []
      selector: { action: {} }
    action_button_up_long:
      name: "Up — long press (hold)"
      default: []
      selector: { action: {} }
    action_button_up_release:
      name: "Up — release after hold"
      default: []
      selector: { action: {} }
    action_button_up_double:
      name: "Up — double press (virtual)"
      default: []
      selector: { action: {} }

    action_button_down_short:
      name: "Down — short press"
      default: []
      selector: { action: {} }
    action_button_down_long:
      name: "Down — long press (hold)"
      default: []
      selector: { action: {} }
    action_button_down_release:
      name: "Down — release after hold"
      default: []
      selector: { action: {} }
    action_button_down_double:
      name: "Down — double press (virtual)"
      default: []
      selector: { action: {} }

    # ══════════════════════════════════════════════════════════
    #  Long-press behavior
    # ══════════════════════════════════════════════════════════
    button_left_long_loop:
      name: "Left — loop long press"
      default: false
      selector: { boolean: {} }
    button_right_long_loop:
      name: "Right — loop long press"
      default: false
      selector: { boolean: {} }
    button_up_long_loop:
      name: "Up — loop long press"
      default: false
      selector: { boolean: {} }
    button_down_long_loop:
      name: "Down — loop long press"
      default: false
      selector: { boolean: {} }
    long_press_interval_ms:
      name: "Long-press tick interval (ms)"
      default: 400
      selector:
        number:
          min: 100
          max: 2000
          step: 50
          unit_of_measurement: ms
          mode: slider
    long_press_max_loop_repeats:
      name: "Long-press max loop repeats (safety cap)"
      default: 500
      selector:
        number:
          min: 1
          max: 5000
          step: 1
          mode: slider

    # ══════════════════════════════════════════════════════════
    #  Double-press behavior
    # ══════════════════════════════════════════════════════════
    button_left_double_press:
      name: "Expose left double-press"
      default: false
      selector: { boolean: {} }
    button_right_double_press:
      name: "Expose right double-press"
      default: false
      selector: { boolean: {} }
    button_up_double_press:
      name: "Expose up double-press"
      default: false
      selector: { boolean: {} }
    button_down_double_press:
      name: "Expose down double-press"
      default: false
      selector: { boolean: {} }
    helper_double_press_delay:
      name: "Helper — Double-press window (ms)"
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          step: 10
          unit_of_measurement: ms
          mode: box

    # ══════════════════════════════════════════════════════════
    #  Debounce
    # ══════════════════════════════════════════════════════════
    helper_debounce_delay:
      name: "Helper — Debounce delay (ms)"
      description: >
        Set to 0 to disable. If you see actions firing twice per press, try 100.
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 10
          unit_of_measurement: ms
          mode: box

# ═══════════════════════════════════════════════════════════════
#  Variables
# ═══════════════════════════════════════════════════════════════
variables:
  # ── Hardware ──
  controller_id: !input controller_device

  # ── Helper entities ──
  helper_last_controller_event: !input helper_last_controller_event
  v_helper_state: !input helper_state

  # ── Lights & dim-to-warm tuning ──
  v_target_lights: !input target_lights
  v_dim_to_warm: !input dim_to_warm_enabled
  v_min_kelvin: !input min_kelvin
  v_max_kelvin: !input max_kelvin
  v_default_brightness: !input default_brightness
  v_bright_step: !input bright_step
  v_transition: !input transition

  # ── State configuration ──
  v_default_state: !input default_state
  v_state_2_colors:
    - !input state_2_color_1
    - !input state_2_color_2
    - !input state_2_color_3
    - !input state_2_color_4
    - !input state_2_color_5
  v_state_4_scenes: !input state_4_scenes
  v_state_indicator_enabled: !input state_indicator_enabled
  v_state_indicator_duration_ms: !input state_indicator_duration_ms

  # ── Long-press loop config ──
  button_left_long_loop: !input button_left_long_loop
  button_right_long_loop: !input button_right_long_loop
  button_up_long_loop: !input button_up_long_loop
  button_down_long_loop: !input button_down_long_loop
  v_long_interval: !input long_press_interval_ms
  long_press_max_loop_repeats: !input long_press_max_loop_repeats

  # ── Double-press config ──
  button_left_double_press: !input button_left_double_press
  button_right_double_press: !input button_right_double_press
  button_up_double_press: !input button_up_double_press
  button_down_double_press: !input button_down_double_press
  helper_double_press_delay: !input helper_double_press_delay

  # ── Debounce ──
  helper_debounce_delay: !input helper_debounce_delay
  adjusted_double_press_delay: "{{ [(helper_double_press_delay | int) -
    (helper_debounce_delay | int), 100] | max }}"

# ═══════════════════════════════════════════════════════════════
#  Mode — restart so a new press cancels the in-flight wait
#  used for double-press detection (matches upstream behaviour).
# ═══════════════════════════════════════════════════════════════
mode: restart
max_exceeded: silent

# ═══════════════════════════════════════════════════════════════
#  Triggers — Z2M MQTT device actions only
# ═══════════════════════════════════════════════════════════════
triggers:
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_left_click
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_left_hold
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_left_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_right_click
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_right_hold
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: arrow_right_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: "on"
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: brightness_move_up
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: brightness_stop
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: "off"
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: brightness_move_down

# ═══════════════════════════════════════════════════════════════
#  Actions
# ═══════════════════════════════════════════════════════════════
actions:
  # ====== STEP 1 — Read the previous event helper FIRST (before    ======
  # ====== overwriting), but make the read defensively bullet-proof ======
  # ====== so any template error returns empty instead of aborting. ======
  - variables:
      trigger_action_final: "{{ trigger.payload | default('') }}"
      _parsed_helper: "{{ states(helper_last_controller_event) | from_json(default={}) }}"
      last_controller_event: "{{ _parsed_helper.a | default('') }}"
      last_controller_event_t: "{{ _parsed_helper.t | default(0) | float(0) }}"
      trigger_delta: "{{ ((as_timestamp(now()) - (last_controller_event_t | float(0)))
        * 1000) | int }}"

  # ====== STEP 2 — Unconditional helper write. This is the FIRST  ======
  # ====== service call so a later template error can't suppress it.======
  - action: input_text.set_value
    target:
      entity_id: !input helper_last_controller_event
    data:
      value: "{{ {'a': trigger_action_final, 't': as_timestamp(now())} | to_json }}"

  # Optional debounce — shorter parallel runs are killed by mode:restart
  # before this delay expires; only the latest one continues.
  - delay:
      milliseconds: "{{ helper_debounce_delay | int }}"

  # Dim-to-warm state, computed defensively (any error -> defaults).
  - variables:
      _parsed_state: "{{ states(v_helper_state) | from_json(default={}) }}"
      cur_b: "{{ _parsed_state.b | default(v_default_brightness, true) | int }}"
      cur_k: >-
        {% set kdef = ((v_min_kelvin | int + v_max_kelvin | int) / 2) | int %}
        {{ _parsed_state.k | default(kdef, true) | int }}
      any_on: "{{ v_target_lights | map('states') | select('eq', 'on') | list | count
        > 0 }}"
      cur_state: "{{ _parsed_state.s | default(v_default_state, true) | int }}"
      cur_index: "{{ _parsed_state.i | default(0) | int }}"
      v_state_2_count: "{{ v_state_2_colors | length }}"
      v_state_4_count: "{{ v_state_4_scenes | length }}"

  - choose:
      # ════ LEFT short ════
      - conditions: "{{ trigger_action_final == 'arrow_left_click' }}"
        sequence:
          - variables:
              new_state: "{{ v_default_state | int }}"
          - choose:
              - conditions: "{{ button_left_double_press }}"
                sequence:
                  - choose:
                      - conditions:
                          - "{{ last_controller_event == 'arrow_left_click' }}"
                          - "{{ trigger_delta <= (helper_double_press_delay |
                            int) }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input helper_last_controller_event
                            data:
                              value: '{{ {"a":"double_press_left","t":as_timestamp(now())} | to_json }}'
                          - choose:
                              - conditions: []
                                sequence: !input action_button_left_double
                    default:
                      - delay:
                          milliseconds: "{{ adjusted_double_press_delay | int }}"
                      - choose:
                          - conditions: []
                            sequence: !input action_button_left_short
                      - action: input_text.set_value
                        target:
                          entity_id: !input helper_state
                        data:
                          value: "{{ dict(_parsed_state, b=cur_b | int, k=cur_k | int, s=new_state, i=0) | to_json }}"
                      - if: "{{ v_state_indicator_enabled and any_on }}"
                        then: &state_indicator
                          - choose:
                              - conditions: "{{ new_state == 1 }}"
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input target_lights
                                    data:
                                      kelvin: 2200
                                      transition: 0.1
                              - conditions: "{{ new_state == 2 }}"
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input target_lights
                                    data:
                                      rgb_color: [ 255, 0, 0 ]
                                      transition: 0.1
                              - conditions: "{{ new_state == 3 }}"
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input target_lights
                                    data:
                                      brightness_pct: 30
                                      transition: 0.1
                              - conditions: "{{ new_state == 4 }}"
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input target_lights
                                    data:
                                      kelvin: 5000
                                      transition: 0.1
                          - delay:
                              milliseconds: "{{ v_state_indicator_duration_ms | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_lights
                            data:
                              brightness: "{{ cur_b | int }}"
                              color_temp_kelvin: "{{ cur_k | int }}"
                              transition: 0.1
            default:
              - choose:
                  - conditions: []
                    sequence: !input action_button_left_short
              - action: input_text.set_value
                target:
                  entity_id: !input helper_state
                data:
                  value: "{{ dict(_parsed_state, b=cur_b | int, k=cur_k | int, s=new_state, i=0) | to_json }}"
              - if: "{{ v_state_indicator_enabled and any_on }}"
                then: *state_indicator

      # ════ LEFT long ════
      - conditions: "{{ trigger_action_final == 'arrow_left_hold' }}"
        sequence:
          - choose:
              - conditions: "{{ button_left_long_loop }}"
                sequence:
                  - repeat:
                      while: "{{ repeat.index < (long_press_max_loop_repeats | int) }}"
                      sequence: !input action_button_left_long
            default: !input action_button_left_long

      # ════ LEFT release ════
      - conditions:
          - "{{ trigger_action_final == 'arrow_left_release' }}"
          - "{{ last_controller_event in ['arrow_left_hold',
            'arrow_left_release'] }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_left_release

      # ════ RIGHT short ════
      - conditions: "{{ trigger_action_final == 'arrow_right_click' }}"
        sequence:
          - variables:
              new_state: "{{ ((cur_state | int) % 4) + 1 }}"
          - choose:
              - conditions: "{{ button_right_double_press }}"
                sequence:
                  - choose:
                      - conditions:
                          - "{{ last_controller_event == 'arrow_right_click' }}"
                          - "{{ trigger_delta <= (helper_double_press_delay |
                            int) }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input helper_last_controller_event
                            data:
                              value: '{{ {"a":"double_press_right","t":as_timestamp(now())} | to_json }}'
                          - choose:
                              - conditions: []
                                sequence: !input action_button_right_double
                    default:
                      - delay:
                          milliseconds: "{{ adjusted_double_press_delay | int }}"
                      - choose:
                          - conditions: []
                            sequence: !input action_button_right_short
                      - action: input_text.set_value
                        target:
                          entity_id: !input helper_state
                        data:
                          value: "{{ dict(_parsed_state, b=cur_b | int, k=cur_k | int, s=new_state, i=0) | to_json }}"
                      - if: "{{ v_state_indicator_enabled and any_on }}"
                        then: *state_indicator
            default:
              - choose:
                  - conditions: []
                    sequence: !input action_button_right_short
              - action: input_text.set_value
                target:
                  entity_id: !input helper_state
                data:
                  value: "{{ dict(_parsed_state, b=cur_b | int, k=cur_k | int, s=new_state, i=0) | to_json }}"
              - if: "{{ v_state_indicator_enabled and any_on }}"
                then: *state_indicator

      # ════ RIGHT long ════
      - conditions: "{{ trigger_action_final == 'arrow_right_hold' }}"
        sequence:
          - choose:
              - conditions: "{{ button_right_long_loop }}"
                sequence:
                  - repeat:
                      while: "{{ repeat.index < (long_press_max_loop_repeats | int) }}"
                      sequence: !input action_button_right_long
            default: !input action_button_right_long

      # ════ RIGHT release ════
      - conditions:
          - "{{ trigger_action_final == 'arrow_right_release' }}"
          - "{{ last_controller_event in ['arrow_right_hold',
            'arrow_right_release'] }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_right_release

      # ════ UP short ════
      - conditions: "{{ trigger_action_final == 'on' }}"
        sequence:
          - choose:
              - conditions: "{{ button_up_double_press }}"
                sequence:
                  - choose:
                      - conditions:
                          - "{{ last_controller_event == 'on' }}"
                          - "{{ trigger_delta <= (helper_double_press_delay |
                            int) }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input helper_last_controller_event
                            data:
                              value: '{{ {"a":"double_press_up","t":as_timestamp(now())} | to_json }}'
                          - choose:
                              - conditions: []
                                sequence: !input action_button_up_double
                    default:
                      - delay:
                          milliseconds: "{{ adjusted_double_press_delay | int }}"
                      - choose:
                          - conditions: []
                            sequence: !input action_button_up_short
                      - choose:
                          # ── State 1 — Dim-to-warm ──
                          &up_step_dispatch
                          - conditions: "{{ cur_state == 1 }}"
                            sequence:
                              - choose:
                                  - conditions: "{{ not any_on }}"
                                    sequence:
                                      - if: "{{ v_dim_to_warm }}"
                                        then:
                                          - action: light.turn_on
                                            target:
                                              entity_id: !input target_lights
                                            data:
                                              color_temp_kelvin: "{{ cur_k | int }}"
                                              transition: "{{ v_transition | float(0) }}"
                                      - action: light.turn_on
                                        target:
                                          entity_id: !input target_lights
                                        data:
                                          brightness: "{{ cur_b | int }}"
                                          transition: "{{ v_transition | float(0) }}"
                                      - action: input_text.set_value
                                        target:
                                          entity_id: !input helper_state
                                        data:
                                          value: "{{ dict(_parsed_state, b=cur_b | int, k=cur_k | int) | to_json }}"
                                default:
                                  - variables:
                                      new_b: "{{ [[(cur_b | int) + (v_bright_step | int), 255] | min, 1] | max }}"
                                      new_k: "{{ ((v_min_kelvin | int) + ((new_b | int - 1) / 254) * ((v_max_kelvin |
                                        int) - (v_min_kelvin | int))) | round(0)
                                        | int }}"
                                  - if: "{{ v_dim_to_warm }}"
                                    then:
                                      - action: light.turn_on
                                        target:
                                          entity_id: !input target_lights
                                        data:
                                          color_temp_kelvin: "{{ new_k | int }}"
                                          transition: "{{ v_transition | float(0) }}"
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input target_lights
                                    data:
                                      brightness: "{{ new_b | int }}"
                                      transition: "{{ v_transition | float(0) }}"
                                  - action: input_text.set_value
                                    target:
                                      entity_id: !input helper_state
                                    data:
                                      value: "{{ dict(_parsed_state, b=new_b | int, k=new_k | int) | to_json }}"
                          # ── State 2 — Color cycle (forward) ──
                          - conditions: "{{ cur_state == 2 }}"
                            sequence:
                              - variables:
                                  new_index: "{{ ((cur_index | int) + 1) % (v_state_2_count | int) }}"
                              - action: light.turn_on
                                target:
                                  entity_id: !input target_lights
                                data:
                                  rgb_color: "{{ v_state_2_colors[new_index | int] }}"
                                  transition: "{{ v_transition | float(0) }}"
                              - action: input_text.set_value
                                target:
                                  entity_id: !input helper_state
                                data:
                                  value: "{{ dict(_parsed_state, i=new_index | int) | to_json }}"
                          # ── State 3 — Brightness only ──
                          - conditions: "{{ cur_state == 3 }}"
                            sequence:
                              - variables:
                                  new_b: "{{ [[(cur_b | int) + (v_bright_step | int), 255] | min, 1] | max }}"
                              - action: light.turn_on
                                target:
                                  entity_id: !input target_lights
                                data:
                                  brightness: "{{ new_b | int }}"
                                  transition: "{{ v_transition | float(0) }}"
                              - action: input_text.set_value
                                target:
                                  entity_id: !input helper_state
                                data:
                                  value: "{{ dict(_parsed_state, b=new_b | int) | to_json }}"
                          # ── State 4 — Scene cycle (forward) ──
                          - conditions: "{{ cur_state == 4 and (v_state_4_count | int) > 0 }}"
                            sequence:
                              - variables:
                                  new_index: "{{ ((cur_index | int) + 1) % (v_state_4_count | int) }}"
                              - action: scene.turn_on
                                target:
                                  entity_id: "{{ v_state_4_scenes[new_index | int] }}"
                              - action: input_text.set_value
                                target:
                                  entity_id: !input helper_state
                                data:
                                  value: "{{ dict(_parsed_state, i=new_index | int) | to_json }}"
            default:
              - choose:
                  - conditions: []
                    sequence: !input action_button_up_short
              - choose: *up_step_dispatch

      # ════ UP long ════
      - conditions: "{{ trigger_action_final == 'brightness_move_up' }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_up_long
          # Hold loop (mode:restart kills it on release)
          - repeat:
              while:
                - "{{ repeat.index < (long_press_max_loop_repeats | int) }}"
              sequence:
                # Re-read helper each iteration so cycle index stays current.
                - variables:
                    _parsed_state: "{{ states(v_helper_state) | from_json(default={}) }}"
                    cur_b: "{{ _parsed_state.b | default(v_default_brightness, true) | int }}"
                    cur_k: >-
                      {% set kdef = ((v_min_kelvin | int + v_max_kelvin | int) /
                      2) | int %} {{ _parsed_state.k | default(kdef, true) | int
                      }}
                    cur_state: "{{ _parsed_state.s | default(v_default_state, true) | int }}"
                    cur_index: "{{ _parsed_state.i | default(0) | int }}"
                    any_on: "{{ v_target_lights | map('states') | select('eq', 'on') | list | count
                      > 0 }}"
                - choose: *up_step_dispatch
                - delay:
                    milliseconds: "{{ v_long_interval | int }}"

      # ════ DOWN short ════
      - conditions: "{{ trigger_action_final == 'off' }}"
        sequence:
          - choose:
              - conditions: "{{ button_down_double_press }}"
                sequence:
                  - choose:
                      - conditions:
                          - "{{ last_controller_event == 'off' }}"
                          - "{{ trigger_delta <= (helper_double_press_delay |
                            int) }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input helper_last_controller_event
                            data:
                              value: '{{ {"a":"double_press_down","t":as_timestamp(now())} | to_json }}'
                          - choose:
                              - conditions: []
                                sequence: !input action_button_down_double
                    default:
                      - delay:
                          milliseconds: "{{ adjusted_double_press_delay | int }}"
                      - choose:
                          - conditions: []
                            sequence: !input action_button_down_short
                      - choose:
                          # ── State 1 — Dim-to-warm ──
                          &down_step_dispatch
                          - conditions: "{{ cur_state == 1 }}"
                            sequence:
                              - choose:
                                  - conditions: "{{ any_on }}"
                                    sequence:
                                      - variables:
                                          new_b_raw: "{{ (cur_b | int) - (v_bright_step | int) }}"
                                      - choose:
                                          - conditions: "{{ new_b_raw | int <= 0 }}"
                                            sequence:
                                              - action: light.turn_off
                                                target:
                                                  entity_id: !input target_lights
                                                data:
                                                  transition: "{{ v_transition | float(0) }}"
                                        default:
                                          - variables:
                                              new_b: "{{ [new_b_raw | int, 1] | max }}"
                                              new_k: "{{ ((v_min_kelvin | int) + ((new_b | int - 1) / 254) * ((v_max_kelvin |
                                                int) - (v_min_kelvin | int))) |
                                                round(0) | int }}"
                                          - if: "{{ v_dim_to_warm }}"
                                            then:
                                              - action: light.turn_on
                                                target:
                                                  entity_id: !input target_lights
                                                data:
                                                  color_temp_kelvin: "{{ new_k | int }}"
                                                  transition: "{{ v_transition | float(0) }}"
                                          - action: light.turn_on
                                            target:
                                              entity_id: !input target_lights
                                            data:
                                              brightness: "{{ new_b | int }}"
                                              transition: "{{ v_transition | float(0) }}"
                                          - action: input_text.set_value
                                            target:
                                              entity_id: !input helper_state
                                            data:
                                              value: "{{ dict(_parsed_state, b=new_b | int, k=new_k | int) | to_json }}"
                          # ── State 2 — Color cycle (backward) ──
                          - conditions: "{{ cur_state == 2 }}"
                            sequence:
                              - variables:
                                  new_index: "{{ ((cur_index | int) - 1) % (v_state_2_count | int) }}"
                              - action: light.turn_on
                                target:
                                  entity_id: !input target_lights
                                data:
                                  rgb_color: "{{ v_state_2_colors[new_index | int] }}"
                                  transition: "{{ v_transition | float(0) }}"
                              - action: input_text.set_value
                                target:
                                  entity_id: !input helper_state
                                data:
                                  value: "{{ dict(_parsed_state, i=new_index | int) | to_json }}"
                          # ── State 3 — Brightness only ──
                          - conditions: "{{ cur_state == 3 and any_on }}"
                            sequence:
                              - variables:
                                  new_b_raw: "{{ (cur_b | int) - (v_bright_step | int) }}"
                              - choose:
                                  - conditions: "{{ new_b_raw | int <= 0 }}"
                                    sequence:
                                      - action: light.turn_off
                                        target:
                                          entity_id: !input target_lights
                                        data:
                                          transition: "{{ v_transition | float(0) }}"
                                default:
                                  - variables:
                                      new_b: "{{ [new_b_raw | int, 1] | max }}"
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input target_lights
                                    data:
                                      brightness: "{{ new_b | int }}"
                                      transition: "{{ v_transition | float(0) }}"
                                  - action: input_text.set_value
                                    target:
                                      entity_id: !input helper_state
                                    data:
                                      value: "{{ dict(_parsed_state, b=new_b | int) | to_json }}"
                          # ── State 4 — Scene cycle (backward) ──
                          - conditions: "{{ cur_state == 4 and (v_state_4_count | int) > 0 }}"
                            sequence:
                              - variables:
                                  new_index: "{{ ((cur_index | int) - 1) % (v_state_4_count | int) }}"
                              - action: scene.turn_on
                                target:
                                  entity_id: "{{ v_state_4_scenes[new_index | int] }}"
                              - action: input_text.set_value
                                target:
                                  entity_id: !input helper_state
                                data:
                                  value: "{{ dict(_parsed_state, i=new_index | int) | to_json }}"
            default:
              - choose:
                  - conditions: []
                    sequence: !input action_button_down_short
              - choose: *down_step_dispatch

      # ════ DOWN long ════
      - conditions: "{{ trigger_action_final == 'brightness_move_down' }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_down_long
          # Hold loop (mode:restart kills it on release)
          - repeat:
              while:
                - "{{ repeat.index < (long_press_max_loop_repeats | int) }}"
              sequence:
                - variables:
                    _parsed_state: "{{ states(v_helper_state) | from_json(default={}) }}"
                    cur_b: "{{ _parsed_state.b | default(v_default_brightness, true) | int }}"
                    cur_k: >-
                      {% set kdef = ((v_min_kelvin | int + v_max_kelvin | int) /
                      2) | int %} {{ _parsed_state.k | default(kdef, true) | int
                      }}
                    cur_state: "{{ _parsed_state.s | default(v_default_state, true) | int }}"
                    cur_index: "{{ _parsed_state.i | default(0) | int }}"
                    any_on: "{{ v_target_lights | map('states') | select('eq', 'on') | list | count
                      > 0 }}"
                - choose: *down_step_dispatch
                - delay:
                    milliseconds: "{{ v_long_interval | int }}"

      # ════ UP/DOWN release (shared brightness_stop event) ════
      - conditions:
          - "{{ trigger_action_final == 'brightness_stop' }}"
          - "{{ last_controller_event in ['brightness_move_up',
            'brightness_stop'] }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_up_release

      - conditions:
          - "{{ trigger_action_final == 'brightness_stop' }}"
          - "{{ last_controller_event == 'brightness_move_down' }}"
        sequence:
          - choose:
              - conditions: []
                sequence: !input action_button_down_release
